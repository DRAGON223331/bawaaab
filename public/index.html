<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Bot — لوحة التحكم</title><style>
:root{--bg:#080c16;--panel:#111827;--panel2:#0d1422;--line:#263249;--text:#f5f7fb;--muted:#9aa6bd;--accent:#5865f2;--ok:#22c55e;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#070b13,#101a2d);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff}.secondary{background:#253149}.danger{background:var(--danger)}.wrap{max-width:1500px;margin:auto;padding:18px}.top,.card,.nav{background:rgba(17,24,39,.97);border:1px solid var(--line);border-radius:16px}.top{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:23px;font-weight:800}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:240px 1fr;gap:16px;margin-top:16px}.nav{padding:10px;height:max-content;position:sticky;top:12px}.nav button{display:block;width:100%;background:transparent;text-align:right;margin-bottom:6px}.nav button.active,.nav button:hover{background:#202b45}.card{padding:18px;margin-bottom:14px}.section{display:none}.section.active{display:block}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,select,textarea{width:100%;background:#090f1b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0a101c;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:right}.toast{position:fixed;bottom:18px;left:18px;background:#18233a;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:20}.login{max-width:430px;margin:12vh auto}.login .card{padding:28px}.role{display:grid;grid-template-columns:1fr 150px 190px;gap:8px;align-items:center;margin-bottom:8px}.badge{display:inline-block;background:#202b45;padding:4px 8px;border-radius:999px}@media(max-width:900px){.grid{grid-template-columns:1fr}.nav{position:static}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.role{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const app=document.getElementById('app');let guilds=[],gid='',data=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function toast(t,ok=true){const x=$('toast');x.textContent=t;x.style.display='block';x.style.borderColor=ok?'#22c55e':'#ef4444';setTimeout(()=>x.style.display='none',3000)}
async function api(path,method='GET',body){const r=await fetch('/api/remote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path,method,body})});if(r.status===401){showLogin();throw Error('انتهت الجلسة')}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function showLogin(){app.innerHTML='<div class="login"><div class="card"><h1>🏰 Tower Bot</h1><p class="muted">تسجيل دخول لوحة التحكم</p><div class="field"><label>اسم المستخدم</label><input id="lu" value="admin"></div><div class="field" style="margin-top:10px"><label>كلمة المرور</label><input id="lp" type="password"></div><div class="actions"><button onclick="login()">🔐 دخول</button></div><p class="muted">هذه اللوحة منفصلة وتعمل من Vercel، والبوت يبقى على Pella.</p></div></div>'}async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('lu').value,password:$('lp').value})});if(!r.ok)throw Error((await r.json()).error);location.reload()}catch(e){toast(e.message,false)}}
function nav(){const a=[['overview','🏠 الرئيسية'],['general','⚙️ الاقتصاد'],['rewards','🎁 الأرباح'],['apartments','🏢 الشقق'],['shop','🛒 المتجر'],['management','👑 الإدارة والبوينتات'],['permissions','🛡️ الصلاحيات والرومات'],['moderation','🤖 AI والحماية'],['payments','💳 المدفوعات'],['advanced','🔧 البوت والتوكن']];return '<aside class="nav">'+a.map((x,i)=>`<button class="n ${i?'':'active'}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')+'<hr><button onclick="logout()">🚪 تسجيل الخروج</button></aside>'}
function shell(){app.innerHTML='<div class="top"><div><div class="brand">🏰 Tower Bot — لوحة التحكم</div><div class="muted">تحكم كامل بالعربي — التغييرات تصل للبوت مباشرة</div></div><div><select id="guild"></select> <button class="secondary" onclick="load()">🔄 تحديث</button></div></div><div class="grid">'+nav()+'<main>'+['overview','general','rewards','apartments','shop','management','permissions','moderation','payments','advanced'].map(x=>`<section id="s-${x}" class="section"></section>`).join('')+'</main></div>';loadGuilds()}
async function loadGuilds(){try{guilds=await api('/api/guilds');$('guild').innerHTML=guilds.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');gid=guilds[0]?.id||'';$('guild').value=gid;if(gid)await load()}catch(e){toast(e.message,false)}}
async function load(){gid=$('guild').value;data=await api('/api/guild/'+gid);renderAll()}
function show(x){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.n').forEach(b=>b.classList.remove('active'));$('s-'+x).classList.add('active');[...document.querySelectorAll('.n')].find(b=>b.getAttribute('onclick')?.includes("'"+x+"'")).classList.add('active')}
function val(k){return data.guild[k]??''}
function renderAll(){renderOverview();renderGeneral();renderRewards();renderApartments();renderShop();renderManagement();renderPermissions();renderModeration();renderPayments();renderAdvanced();show('overview')}
function renderOverview(){$('s-overview').innerHTML=`<div class="card"><h2>📊 نظرة عامة</h2><div class="stats"><div class="stat">👥 المستخدمون<b>${data.stats.users}</b></div><div class="stat">🏢 الشقق<b>${data.stats.apartments}</b></div><div class="stat">🔑 المملوكة<b>${data.stats.owned}</b></div><div class="stat">💰 إجمالي العملات<b>${esc(data.stats.coins)}</b></div></div></div><div class="card"><h3>السيرفر الحالي</h3><p>${esc(data.guild.name)} <span class="badge">${data.guild.id}</span></p></div>`}
function field(id,label,k,type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val(k))}"></div>`}function setFields(keys){const p={};keys.forEach(k=>p[k]=$('f-'+k).value);return p}async function save(p){await api('/api/guild/'+gid,'POST',p);toast('تم الحفظ بنجاح');await load()}
function renderGeneral(){$('s-general').innerHTML=`<div class="card"><h2>⚙️ إعدادات الاقتصاد</h2><div class="form">${field('f-coinName','اسم العملة','coinName')}${field('f-coinSymbol','رمز العملة','coinSymbol')}${field('f-apartmentCount','عدد الشقق','apartmentCount','number')}${field('f-rerollsPerUser','عدد إعادة الاختيار','rerollsPerUser','number')}${field('f-dailyCoinCap','الحد اليومي','dailyCoinCap','number')}</div><div class="actions"><button onclick="save(setFields(['coinName','coinSymbol','apartmentCount','rerollsPerUser','dailyCoinCap']))">💾 حفظ</button></div></div>`}
function renderRewards(){$('s-rewards').innerHTML=`<div class="card"><h2>🎁 الأرباح والنشاط</h2><div class="form">${field('f-chatMin','أقل مكافأة رسالة','chatMin','number')}${field('f-chatMax','أعلى مكافأة رسالة','chatMax','number')}${field('f-chatCooldownSeconds','مهلة الرسائل بالثواني','chatCooldownSeconds','number')}${field('f-voicePerMinute','بوينت/عملة الصوت بالدقيقة','voicePerMinute','number')}${field('f-inviteReward','مكافأة الدعوة','inviteReward','number')}${field('f-boostReward','مكافأة البوست','boostReward','number')}${field('f-doubleBoostReward','مكافأة Double Boost','doubleBoostReward','number')}${field('f-voiceMinMembers','أقل أعضاء للصوت','voiceMinMembers','number')}${field('f-inviteMinAccountAgeHours','عمر الحساب للدعوة بالساعات','inviteMinAccountAgeHours','number')}${field('f-duplicateMessageWindowSeconds','منع تكرار الرسائل بالثواني','duplicateMessageWindowSeconds','number')}</div><div class="actions"><button onclick="save(setFields(['chatMin','chatMax','chatCooldownSeconds','voicePerMinute','inviteReward','boostReward','doubleBoostReward','voiceMinMembers','inviteMinAccountAgeHours','duplicateMessageWindowSeconds']))">💾 حفظ</button></div></div>`}
function renderApartments(){$('s-apartments').innerHTML=`<div class="card"><h2>🏢 الشقق</h2><p class="muted">عدد الشقق وإعادة الاختيار تُحفظ في البوت.</p><div class="form">${field('f2-apartmentCount','عدد الشقق','apartmentCount','number')}${field('f2-rerollsPerUser','إعادات الاختيار','rerollsPerUser','number')}</div><div class="actions"><button onclick="save({apartmentCount:Number($('f2-apartmentCount').value),rerollsPerUser:Number($('f2-rerollsPerUser').value)})">💾 حفظ</button><button class="secondary" onclick="action('/api/action/sync-apartments/'+gid)">🔄 مزامنة الشقق</button></div></div>`}
async function action(path){await api(path,'POST',{});toast('تم التنفيذ');await load()}
function renderShop(){const items=data.shop||[];$('s-shop').innerHTML=`<div class="card"><h2>🛒 المتجر</h2><p class="muted">إدارة عناصر المتجر من هنا.</p><div class="table"><table class="table"><tr><th>الاسم</th><th>السعر</th><th>النوع</th><th>الحالة</th></tr>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.price)}</td><td>${esc(x.type||'')}</td><td>${x.enabled===false?'متوقف':'فعال'}</td></tr>`).join('')}</table></div><details style="margin-top:14px"><summary>➕ إضافة عنصر</summary><div class="form" style="margin-top:12px">${['name','price','type','roleId','durationDays','description'].map(k=>`<div class="field"><label>${k}</label><input id="new-${k}"></div>`).join('')}</div><div class="actions"><button onclick="addShop()">إضافة</button></div></details></div>`}
async function addShop(){const p={};['name','price','type','roleId','durationDays','description'].forEach(k=>p[k]=$('new-'+k).value);p.enabled=true;await api('/api/shop/'+gid,'POST',p);toast('تمت إضافة العنصر');await load()}
function renderManagement(){const m=data.management||{};$('s-management').innerHTML=`<div class="card"><h2>👑 الإدارة والبوينتات</h2><p>رتبة الصلاحية العامة: <span class="badge">1556486551720951878</span></p><div class="field"><label>روم نشر قائمة الرتب</label><input id="mg-channel" value="${esc(m.channelId||'')}"></div><div class="actions"><button onclick="mgChannel()">💾 حفظ الروم</button><button onclick="sendManagement()">📤 إرسال القائمة</button></div><hr><h3>الرتب المرتبة</h3>${(m.roles||[]).map((r,i)=>`<div class="role"><div><b>${i+1}. ${esc(r.name||r.roleId)}</b><div class="muted">${r.roleId}</div></div><input id="price-${r.roleId}" type="number" step="0.001" min="0" value="${r.price}"><div><button class="mini" onclick="moveRole('${r.roleId}',-1)">⬆️</button> <button class="mini" onclick="moveRole('${r.roleId}',1)">⬇️</button> <button class="mini" onclick="updatePrice('${r.roleId}')">💾</button> <button class="mini danger" onclick="removeRole('${r.roleId}')">حذف</button></div></div>`).join('')}<hr><h3>إضافة رتبة</h3><select id="mg-role">${(m.availableRoles||[]).map(r=>`<option value="${r.id}">${esc(r.name)} — ${r.id}</option>`).join('')}</select><input id="mg-price" type="number" step="0.001" min="0" placeholder="السعر بالبوينتات" style="margin-top:8px"><div class="actions"><button onclick="addRole()">➕ إضافة الرتبة</button></div><hr><h3>إضافة بوينتات لعضو</h3><div class="form"><div class="field"><label>User ID</label><input id="pt-user"></div><div class="field"><label>الكمية (تقبل 0.5 وأقل)</label><input id="pt-amount" type="number" step="0.001" min="0.001"></div></div><div class="actions"><button onclick="addPoints()">🪙 إضافة البوينتات</button></div></div>`}
async function mgChannel(){await api('/api/management/'+gid,'POST',{channelId:$('mg-channel').value});toast('تم حفظ روم النشر');await load()}async function sendManagement(){await api('/api/management-send/'+gid,'POST',{});toast('تم إرسال القائمة للروم')}async function addRole(){await api('/api/management/'+gid,'POST',{add:{roleId:$('mg-role').value,price:$('mg-price').value}});toast('تمت إضافة الرتبة');await load()}async function updatePrice(id){await api('/api/management/'+gid,'POST',{update:{roleId:id,price:$('price-'+id).value}});toast('تم تعديل السعر');await load()}async function moveRole(id,d){await api('/api/management/'+gid,'POST',{move:{roleId:id,direction:d}});toast('تم تعديل الترتيب');await load()}async function removeRole(id){if(!confirm('حذف الرتبة؟'))return;await api('/api/management/'+gid,'POST',{remove:id});toast('تم الحذف');await load()}async function addPoints(){const r=await api('/api/points/'+gid,'POST',{userId:$('pt-user').value,amount:$('pt-amount').value});toast('تمت إضافة '+r.added+' — الإجمالي '+r.total)}
function renderPermissions(){$('s-permissions').innerHTML=`<div class="card"><h2>🛡️ الصلاحيات والرومات</h2><div class="form">${field('f-adminRoleId','رتبة الإدارة العامة','adminRoleId')}${field('f-paymentAdminRoleId','رتبة إدارة المدفوعات','paymentAdminRoleId')}${field('f-supportRoleId','رتبة الدعم','supportRoleId')}${field('f-logChannelId','روم اللوج','logChannelId')}${field('f-boosterRoleId','رتبة البوستر','boosterRoleId')}${field('f-ticketCategoryId','تصنيف التذاكر','ticketCategoryId')}</div><div class="actions"><button onclick="save(setFields(['adminRoleId','paymentAdminRoleId','supportRoleId','logChannelId','boosterRoleId','ticketCategoryId']))">💾 حفظ</button></div></div>`}
function renderModeration(){$('s-moderation').innerHTML=`<div class="card"><h2>🤖 AI والحماية</h2><div class="form"><div class="field"><label>تفعيل AI</label><select id="ai-enabled"><option value="true" ${data.moderation.enabled?'selected':''}>مفعل</option><option value="false" ${!data.moderation.enabled?'selected':''}>متوقف</option></select></div><div class="field"><label>حذف الصور الضارة</label><select id="ai-delete"><option value="true" ${data.moderation.deleteMalicious?'selected':''}>نعم</option><option value="false" ${!data.moderation.deleteMalicious?'selected':''}>لا</option></select></div><div class="field"><label>الموديل</label><input id="ai-model" value="${esc(data.moderation.model)}"></div><div class="field"><label>OpenAI API Key</label><input id="ai-key" type="password" placeholder="اتركه فارغًا إذا لم ترد تغييره"></div></div><p class="muted">الحالة: ${data.moderation.hasKey?'مفتاح موجود':'لا يوجد مفتاح'} ${esc(data.moderation.keyHint||'')}</p><div class="actions"><button onclick="saveAI()">💾 حفظ AI</button></div></div>`}async function saveAI(){await api('/api/ai','POST',{enabled:$('ai-enabled').value==='true',deleteMalicious:$('ai-delete').value==='true',model:$('ai-model').value,apiKey:$('ai-key').value});toast('تم حفظ إعدادات AI');await load()}
function renderPayments(){$('s-payments').innerHTML=`<div class="card"><h2>💳 المدفوعات</h2><div class="form">${field('f-publicBaseUrl','Public URL','publicBaseUrl')}${field('f-paymobPort','Paymob Port','paymobPort','number')}</div><div class="actions"><button onclick="saveEnv()">💾 حفظ</button></div></div>`}async function saveEnv(){await api('/api/env','POST',{publicBaseUrl:$('f-publicBaseUrl').value,paymobPort:$('f-paymobPort').value});toast('تم حفظ إعدادات المدفوعات')}
function renderAdvanced(){$('s-advanced').innerHTML=`<div class="card"><h2>🔧 البوت والتوكن</h2><p class="muted">التوكن يُحفظ على البوت، ولا يظهر كاملًا هنا.</p><div class="form"><div class="field"><label>Discord Bot Token</label><input id="bot-token" type="password" placeholder="اتركه فارغًا إذا لم ترد تغييره"></div><div class="field"><label>Client ID</label><input id="client-id" value="${esc(data.config.clientId||'')}"></div><div class="field"><label>كلمة مرور الداشبورد</label><input id="dash-pass" type="password"></div></div><p class="muted">الحالة: ${data.secrets.discordToken?'توكن محفوظ':'لا يوجد توكن محفوظ في إعدادات الداشبورد'}</p><div class="actions"><button onclick="saveBot()">💾 حفظ وتشغيل التغييرات</button><button class="secondary" onclick="registerCmds()">📋 تسجيل أوامر Slash</button></div></div>`}async function saveBot(){await api('/api/bot','POST',{token:$('bot-token').value,clientId:$('client-id').value,password:$('dash-pass').value});toast('تم حفظ إعدادات البوت');await load()}async function registerCmds(){const r=await api('/api/register-commands','POST',{});toast('تم تسجيل '+r.count+' أمر')}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
showLogin();fetch('/api/remote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:'/api/guilds',method:'GET'})}).then(r=>{if(r.status!==401){shell()}}).catch(()=>{});
</script></body></html>
